{% extends 'base.html' %}

{% block content %}
    <h1 class="my-4">Home Page</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4 pb-4">
    {% for post in posts %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                {% if post.poster %}
                    <img src="{{ post.poster.url }}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="{{ post.title }}">
                {% endif %}
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text text-muted flex-grow-1">{{ post.body|truncatewords:20 }}</p>
                    <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center text-muted">
                        <small class="fw-semibold">{{ post.user.username }}</small>
                        <small>{{ post.created_at|date:"M. d, Y, g:i a" }}</small>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
    </div>
{% endblock %}
